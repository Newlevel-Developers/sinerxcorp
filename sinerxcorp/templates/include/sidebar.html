{% load static %}

<!-- Overlay para móvil -->
<div id="sidebar-overlay"
     class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden transition-opacity duration-300"
     onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar"
    class="fixed lg:sticky top-0 left-0 z-50 lg:z-auto
    w-64 h-screen lg:h-auto
    bg-white dark:bg-gray-800
    text-slate-800 dark:text-white
    flex flex-col shrink-0
    -translate-x-full lg:translate-x-0
    transition-transform duration-300 ease-in-out
    shadow-2xl lg:shadow-none
    border-r border-slate-200 dark:border-slate-700/50">

    <!-- Logo / Encabezado -->
    <div class="p-5 text-lg font-bold border-b border-slate-200 dark:border-slate-700/70 flex items-center justify-between gap-2">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-md shadow-blue-500/30">
                <i class="fa-solid fa-graduation-cap text-white text-sm"></i>
            </div>
            <span>Mi Panel</span>
        </div>
        <button onclick="toggleSidebar()"
                class="lg:hidden text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </div>

    <!-- Menú de navegación -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg
                        bg-blue-600 text-white font-medium shadow-md shadow-blue-600/20
                        transition-colors">
            <i class="fa-solid fa-house w-5 text-center"></i>
            <span>Inicio</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg
                        text-slate-600 dark:text-slate-300
                        hover:bg-slate-100 dark:hover:bg-slate-700/70
                        hover:text-slate-900 dark:hover:text-white transition-colors">
            <i class="fa-solid fa-folder w-5 text-center"></i>
            <span>Proyectos</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg
                        text-slate-600 dark:text-slate-300
                        hover:bg-slate-100 dark:hover:bg-slate-700/70
                        hover:text-slate-900 dark:hover:text-white transition-colors">
            <i class="fa-solid fa-users w-5 text-center"></i>
            <span>Clientes</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg
                        text-slate-600 dark:text-slate-300
                        hover:bg-slate-100 dark:hover:bg-slate-700/70
                        hover:text-slate-900 dark:hover:text-white transition-colors">
            <i class="fa-solid fa-gear w-5 text-center"></i>
            <span>Configuración</span>
        </a>
    </nav>

    <!-- Pie del Sidebar -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-700/70 text-xs text-slate-500 dark:text-slate-400">
        © 2026 Mi Empresa
    </div>
</aside>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    }
</script>
