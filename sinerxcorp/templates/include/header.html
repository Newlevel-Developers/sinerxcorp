{% load static %}
<!-- Header / Navbar -->
<header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-md sticky top-0 z-50 border-b border-slate-100 dark:border-slate-800 transition-colors duration-300">
    <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">

        <!-- Logo & Title -->
        <a href="/" class="flex items-center space-x-3 shrink-0 group">
            <img src="{% static 'img/logo.png' %}" alt="Logo"
                class="h-14 w-auto object-contain transition-transform duration-300 group-hover:scale-105 dark:text-white">
        </a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center space-x-1 font-semibold text-sm text-slate-600 dark:text-slate-300 uppercase tracking-wider">
            <a href="/"
                class="relative px-3 py-2 rounded-lg text-slate-900 dark:text-white transition-colors duration-200
                    after:content-[''] after:absolute after:left-3 after:right-3 after:-bottom-0.5
                    after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:rounded-full">
                Inicio
            </a>
            <a href="#"
                class="relative px-3 py-2 rounded-lg hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800
                    transition-all duration-200
                    after:content-[''] after:absolute after:left-3 after:right-3 after:-bottom-0.5
                    after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:rounded-full after:scale-x-0
                    hover:after:scale-x-100 after:transition-transform after:origin-left">
                Catálogo
            </a>
            <a href="#"
                class="relative px-3 py-2 rounded-lg hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800
                    transition-all duration-200
                    after:content-[''] after:absolute after:left-3 after:right-3 after:-bottom-0.5
                    after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:rounded-full after:scale-x-0
                    hover:after:scale-x-100 after:transition-transform after:origin-left">
                Progreso
            </a>
        </nav>

        <!-- Search Bar & User Profile -->
        <div class="flex items-center space-x-3 sm:space-x-5">

            <button id="btn-tema" onclick="alternarTema()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span id="icono-tema">☀️</span>
                <span id="texto-tema">Claro</span>
            </button>
            
            <div class="relative hidden sm:block group">
                <input type="text" placeholder="Buscar..."
                    class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 rounded-full
                            pl-10 pr-4 py-2 text-sm w-44 lg:w-56
                            border border-transparent
                            focus:outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-blue-500 dark:focus:border-blue-400
                            focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40
                            transition-all duration-200">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2
                        text-slate-400 dark:text-slate-500 text-sm transition-colors group-focus-within:text-blue-500 dark:group-focus-within:text-blue-400"></i>
            </div>

            <!-- User Dropdown -->
            {% if user.is_authenticated %}
                <button type="button"
                        class="flex items-center space-x-2 pl-1 pr-2 py-1 rounded-full
                            hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors duration-200 group">
                    <span class="hidden sm:inline font-semibold text-sm text-slate-800 dark:text-slate-200">
                        Luis N.
                    </span>
                    <img src="https://i.pravatar.cc/100?img=33" alt="Avatar"
                        class="w-9 h-9 rounded-full object-cover ring-2 ring-white dark:ring-slate-800 shadow-sm
                                group-hover:ring-blue-200 dark:group-hover:ring-blue-500 transition-all duration-200">
                    <i class="fa-solid fa-caret-down text-xs text-slate-500 dark:text-slate-400
                            group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-200"></i>
                </button>
            {% else %}
                <a href="{% url 'login_views' %}"
                    class="text-sm font-semibold text-slate-700 dark:text-slate-200 px-3 py-2 rounded-full
                        hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-slate-800 transition-colors duration-200">
                    Iniciar Sesión
                </a>
                <a href="{% url 'register' %}"
                    class="bg-gradient-to-r from-blue-600 to-blue-500 text-white
                            px-4 py-2 rounded-full text-sm font-semibold
                            shadow-md shadow-blue-500/20
                            hover:from-blue-700 hover:to-blue-600 hover:shadow-lg hover:shadow-blue-500/30
                            active:scale-95 transition-all duration-200">
                    Registrarme
                </a>
            {% endif %}
        </div>
    </div>
</header>
