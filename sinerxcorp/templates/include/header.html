{% load static %}
<!-- Header / Navbar -->
<header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-md sticky top-0 z-30
               border-b border-slate-100 dark:border-slate-800 transition-colors duration-300">
    <div class="max-w-8xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 flex items-center justify-between gap-3">

        <!-- Botón hamburguesa (solo móvil/tablet) -->
        <button onclick="toggleSidebar()"
                class="lg:hidden p-2 rounded-lg text-slate-700 dark:text-slate-200
                    hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                aria-label="Abrir menú">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>

        <!-- Logo -->
        <a href="/" class="flex items-right space-x-2 shrink-0 group">
            <img src="{% static 'img/logo.png' %}" alt="Logo"
                class="h-11 sm:h-14 w-auto object-contain transition-transform duration-300 group-hover:scale-105">

        </a>

        <!-- Nav Links (desktop) -->
        <nav class="hidden md:flex items-center space-x-1 font-semibold text-sm text-slate-600 dark:text-slate-300 uppercase tracking-wider">
            <a href="/" class="relative px-3 py-2 rounded-lg text-slate-900 dark:text-white transition-colors duration-200
                    after:content-[''] after:absolute after:left-3 after:right-3 after:-bottom-0.5
                    after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:rounded-full">
                Inicio
            </a>
            <a href="#" class="relative px-3 py-2 rounded-lg hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800
                    transition-all duration-200
                    after:content-[''] after:absolute after:left-3 after:right-3 after:-bottom-0.5
                    after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:rounded-full after:scale-x-0
                    hover:after:scale-x-100 after:transition-transform after:origin-left">
                Catálogo
            </a>
            <a href="#" class="relative px-3 py-2 rounded-lg hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800
                    transition-all duration-200
                    after:content-[''] after:absolute after:left-3 after:right-3 after:-bottom-0.5
                    after:h-0.5 after:bg-blue-600 dark:after:bg-blue-400 after:rounded-full after:scale-x-0
                    hover:after:scale-x-100 after:transition-transform after:origin-left">
                Progreso
            </a>
        </nav>

        <!-- Acciones -->
        <div class="flex items-center space-x-2 sm:space-x-3">

            <!-- Tema -->
            <button id="btn-tema" onclick="alternarTema()"
                    class="flex items-center gap-2 px-2.5 sm:px-3 py-1.5 rounded-lg text-sm font-medium
                           border border-slate-200 dark:border-slate-700
                           text-slate-700 dark:text-slate-200
                           hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span id="icono-tema">☀️</span>
                <span id="texto-tema" class="hidden sm:inline">Claro</span>
            </button>

            <!-- Buscador (oculto en móvil muy pequeño) -->
            <div class="relative hidden md:block group">
                <input type="text" placeholder="Buscar..."
                       class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200
                              placeholder-slate-400 dark:placeholder-slate-500 rounded-full
                              pl-10 pr-4 py-2 text-sm w-40 lg:w-56
                              border border-transparent
                              focus:outline-none focus:bg-white dark:focus:bg-slate-900
                              focus:border-blue-500 dark:focus:border-blue-400
                              focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40
                              transition-all duration-200">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2
                          text-slate-400 dark:text-slate-500 text-sm
                          transition-colors group-focus-within:text-blue-500"></i>
            </div>

            <!-- Usuario -->
            {% if user.is_authenticated %}
                <div class="relative">
                    <button type="button" onclick="toggleUserMenu()"
                            class="flex items-center space-x-2 pl-1 pr-2 py-1 rounded-full
                                   hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
                        <span class="hidden sm:inline font-semibold text-sm text-slate-800 dark:text-slate-200">
                            Luis N.
                        </span>
                        <img src="https://i.pravatar.cc/100?img=33" alt="Avatar"
                             class="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover ring-2 ring-white dark:ring-slate-800 shadow-sm
                                    group-hover:ring-blue-200 dark:group-hover:ring-blue-500 transition-all">
                        <i class="fa-solid fa-caret-down text-xs text-slate-500 dark:text-slate-400
                                  group-hover:text-blue-600 transition-colors"></i>
                    </button>

                    <!-- Dropdown -->
                    <div id="user-menu"
                         class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800
                                rounded-xl shadow-xl border border-slate-100 dark:border-slate-700
                                py-2 z-50 overflow-hidden">
                        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200
                                          hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            <i class="fa-solid fa-user w-4 text-center"></i> Mi perfil
                        </a>
                        <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200
                                          hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            <i class="fa-solid fa-gear w-4 text-center"></i> Configuración
                        </a>
                        <div class="border-t border-slate-100 dark:border-slate-700 my-1"></div>
                        <a href="{% url "logout_user" %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 dark:text-red-400
                                          hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <i class="fa-solid fa-right-from-bracket w-4 text-center"></i> Cerrar sesión
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="{% url 'login_views' %}"
                   class="text-sm font-semibold text-slate-700 dark:text-slate-200 px-2 sm:px-3 py-2 rounded-full
                          hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-slate-800 transition-colors">
                    Iniciar Sesión
                </a>
                <a href="{% url 'register' %}"
                   class="bg-gradient-to-r from-blue-600 to-blue-500 text-white
                          px-3 sm:px-4 py-2 rounded-full text-sm font-semibold
                          shadow-md shadow-blue-500/20
                          hover:from-blue-700 hover:to-blue-600 hover:shadow-lg hover:shadow-blue-500/30
                          active:scale-95 transition-all duration-200">
                    Registrarme
                </a>
            {% endif %}
        </div>
    </div>
</header>

<script>
    function toggleUserMenu() {
        document.getElementById('user-menu').classList.toggle('hidden');
    }
    // Cierra el menú al hacer clic fuera
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('user-menu');
        if (menu && !e.target.closest('.relative')) menu.classList.add('hidden');
    });
</script>
